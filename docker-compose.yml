version: "3.9"
services:
  frontend:
    build: .
    ports:
      - "3000:8080" # 👈 Cambiado de 3000 a 8080 (puerto interno seguro de Nginx)
    depends_on:
      - db

  db:
    image: postgres:15-alpine # 💡 Tip: Usar una versión específica y alpine es mejor práctica
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"